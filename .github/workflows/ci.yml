name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quero
          POSTGRES_PASSWORD: quero
          POSTGRES_DB: quero_assistir_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quero -d quero_assistir_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://quero:quero@localhost:5432/quero_assistir_test
      TEST_DATABASE_URL: postgresql://quero:quero@localhost:5432/quero_assistir_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @quero-assistir/api exec prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Migrations + testes e2e da API (Postgres real)
        run: |
          pnpm --filter @quero-assistir/api prisma:deploy
          pnpm --filter @quero-assistir/api test:e2e
      - name: Build
        run: pnpm build

  docker:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
